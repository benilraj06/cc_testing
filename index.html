<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <meta name="theme-color" content="#3b5bdb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <span class="topbar-title" id="topbarTitle">Hello World</span>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Applications">
    <div class="sidebar-brand">Toolbox</div>
    <ul class="nav-list">
      <li><a href="#home" data-app="home">🏠 Home</a></li>
      <li><a href="#md5" data-app="md5">#️⃣ MD5 Hasher</a></li>
    </ul>
  </nav>
  <div class="backdrop" id="backdrop"></div>

  <main class="content">
    <!-- Each app is a <section data-app="id" data-title="..."> plus a nav link above. -->
    <section data-app="home" data-title="Hello World" class="app app-home">
      <h1>Hello, World!</h1>
      <p class="muted">Pick an app from the sidebar.</p>
    </section>

    <section data-app="md5" data-title="MD5 Hasher" class="app" hidden>
      <h1>MD5 Hasher</h1>

      <label for="md5Input">Text</label>
      <textarea id="md5Input" rows="6" placeholder="Type or paste text…"></textarea>

      <div class="or">or</div>

      <label for="md5File">File</label>
      <input type="file" id="md5File">

      <label for="md5Output">MD5 hash</label>
      <div class="output-row">
        <output id="md5Output" class="hash">d41d8cd98f00b204e9800998ecf8427e</output>
        <button id="md5Copy" type="button">Copy</button>
      </div>
      <p class="muted small" id="md5Source">Hash of: empty text</p>
    </section>
  </main>

  <script src="js/md5.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
