<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <meta name="theme-color" content="#3b5bdb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <span class="topbar-title" id="topbarTitle">Hello World</span>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Applications">
    <div class="sidebar-brand">Toolbox</div>
    <ul class="nav-list">
      <li><a href="#home" data-app="home"><span class="nav-icon">🏠</span>Home</a></li>
      <li><a href="#md5" data-app="md5" data-desc="Hash text or files with MD5."><span class="nav-icon">#️⃣</span>MD5 Hasher</a></li>
      <li><a href="#base64" data-app="base64" data-desc="Encode or decode text and files as Base64."><span class="nav-icon">🔤</span>Base64 Encoder</a></li>
    </ul>
  </nav>
  <div class="backdrop" id="backdrop"></div>

  <main class="content">
    <!-- Each app is a <section data-app="id" data-title="..."> plus a nav link above. -->
    <section data-app="home" data-title="Hello World" class="app app-home">
      <h1>Hello, World!</h1>
      <p class="muted">Pick an app to get started.</p>
      <!-- Filled from the sidebar links by js/app.js -->
      <div class="tiles" id="tiles"></div>
    </section>

    <section data-app="md5" data-title="MD5 Hasher" class="app" hidden>
      <h1>MD5 Hasher</h1>

      <label for="md5Input">Text</label>
      <textarea id="md5Input" rows="6" placeholder="Type or paste text…"></textarea>

      <div class="or">or</div>

      <label for="md5File">File</label>
      <input type="file" id="md5File">

      <label for="md5Output">MD5 hash</label>
      <div class="output-row">
        <output id="md5Output" class="hash">d41d8cd98f00b204e9800998ecf8427e</output>
        <button id="md5Copy" type="button">Copy</button>
      </div>
      <p class="muted small" id="md5Source">Hash of: empty text</p>
    </section>

    <section data-app="base64" data-title="Base64 Encoder" class="app" hidden>
      <h1>Base64 Encoder</h1>

      <div class="mode-toggle" role="radiogroup" aria-label="Mode">
        <label><input type="radio" name="b64Mode" value="encode" checked> Encode</label>
        <label><input type="radio" name="b64Mode" value="decode"> Decode</label>
      </div>

      <label for="b64Input" id="b64InputLabel">Text</label>
      <textarea id="b64Input" rows="6" placeholder="Type or paste text…"></textarea>

      <div id="b64FileGroup">
        <div class="or">or</div>
        <label for="b64File">File</label>
        <input type="file" id="b64File">
      </div>

      <label for="b64Output" id="b64OutputLabel">Base64</label>
      <div class="output-row">
        <output id="b64Output" class="hash"></output>
        <button id="b64Copy" type="button">Copy</button>
      </div>
      <p class="muted small" id="b64Status"></p>
    </section>
  </main>

  <script src="js/md5.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
